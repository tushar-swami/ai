apiVersion: v1
kind: Pod
metadata:
  name: analytics-worker
  namespace: default
  labels:
    app: analytics-worker
spec:
  restartPolicy: Always
  containers:
  - name: worker
    image: python:3.11-alpine
    command: ["python", "-u", "-c"]
    args:
    - |
      import time
      print("=== Analytics Worker Starting ===", flush=True)
      print("Loading batch training dataset...", flush=True)
      time.sleep(2)
      # Allocating 80MB of heap RAM (exceeds 40Mi limit)
      dataset = [b"x" * 1024 * 1024 for _ in range(80)]
      print("Dataset loaded successfully!", flush=True)
      time.sleep(3600)
    resources:
      limits:
        memory: "40Mi"
      requests:
        memory: "20Mi"
