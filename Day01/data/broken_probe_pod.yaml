apiVersion: v1
kind: Pod
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  restartPolicy: Always
  containers:
  - name: web
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      mkdir -p /var/www
      echo '{"status": "ok", "service": "order-service"}' > /var/www/index.html
      echo "=== Order Service running on port 8080 ==="
      httpd -f -p 8080 -h /var/www
    ports:
    - containerPort: 8080
    # Misconfigured probe: querying /healthz instead of / or /index.html
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
